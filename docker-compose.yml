services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vitatrack_develop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - vitatrack-db:/var/lib/postgresql/data

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=db;Database=vitatrack_develop;Username=postgres;Password=postgres
      JwtSettings__Key: development-only-change-me
      JwtSettings__Issuer: VitaTrack
      JwtSettings__Audience: VitaTrack.Api
      JwtSettings__ExpiryMinutes: 60
      AllowedOrigins__0: http://localhost:5173
      Database__MigrateOnStartup: "true"
    ports:
      - "5177:8080"
    depends_on:
      - db

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5177
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  vitatrack-db:
